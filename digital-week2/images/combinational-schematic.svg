<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; rx: 12px; }
      .grid-line { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 4 4; }
      .wire { stroke: #94a3b8; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .wire-hi { stroke: #10b981; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .wire-lo { stroke: #475569; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .gate-body { fill: rgba(6, 182, 212, 0.15); stroke: #22d3ee; stroke-width: 2.5; stroke-linejoin: round; }
      .gate-inv { fill: rgba(245, 158, 11, 0.15); stroke: #f59e0b; stroke-width: 2.5; }
      .gate-or { fill: rgba(16, 185, 129, 0.15); stroke: #10b981; stroke-width: 2.5; }
      .ic-badge { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; fill: #fbbf24; }
      .label { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 700; fill: #ffffff; }
      .sublabel { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #94a3b8; }
      .term-tag { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; fill: #38bdf8; }
      .out-tag { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 800; fill: #34d399; }
      .junction { fill: #38bdf8; }
      .box { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 8px; }
    </style>
  </defs>

  <rect width="860" height="380" class="bg"/>

  <!-- Title & Subtitle -->
  <text x="30" y="36" class="label" font-size="16" fill="#38bdf8">Combinational Logic Schematic: Chemical Mixing Tank Pump Controller</text>
  <text x="30" y="58" class="sublabel">Specification: Motor Y = (Manual Auto · Master Run) + (High Temp · Tank Low) = (A · B) + (C · D)</text>

  <!-- Input Terminals on the Left -->
  <!-- A: Mode Switch -->
  <g transform="translate(40, 90)">
    <rect width="110" height="34" class="box"/>
    <circle cx="16" cy="17" r="5" fill="#38bdf8"/>
    <text x="30" y="22" class="label">A: AUTO</text>
  </g>
  <!-- B: Run Pushbutton -->
  <g transform="translate(40, 140)">
    <rect width="110" height="34" class="box"/>
    <circle cx="16" cy="17" r="5" fill="#38bdf8"/>
    <text x="30" y="22" class="label">B: RUN</text>
  </g>
  <!-- C: High Temp -->
  <g transform="translate(40, 220)">
    <rect width="110" height="34" class="box"/>
    <circle cx="16" cy="17" r="5" fill="#f59e0b"/>
    <text x="30" y="22" class="label">C: TEMP</text>
  </g>
  <!-- D: Level Low -->
  <g transform="translate(40, 270)">
    <rect width="110" height="34" class="box"/>
    <circle cx="16" cy="17" r="5" fill="#f59e0b"/>
    <text x="30" y="22" class="label">D: LEVEL</text>
  </g>

  <!-- Stage 1: Upper AND Gate 1 (74LS08 Gate 1) -->
  <!-- Inputs A and B -->
  <line x1="150" y1="107" x2="280" y2="107" class="wire"/>
  <line x1="150" y1="157" x2="250" y2="157" class="wire"/>
  <line x1="250" y1="157" x2="250" y2="133" class="wire"/>
  <line x1="250" y1="133" x2="280" y2="133" class="wire"/>

  <g transform="translate(280, 95)">
    <!-- 74LS08 AND Gate 1 (Pins 1, 2 -> 3) -->
    <path d="M0,0 L35,0 A25,25 0 0,1 35,50 L0,50 Z" class="gate-body"/>
    <text x="10" y="30" font-family="Inter" font-weight="800" font-size="14" fill="#22d3ee">&amp;</text>
    <text x="5" y="-6" class="ic-badge">IC1: 74LS08 (1/4)</text>
    <text x="-16" y="16" class="sublabel">p1</text>
    <text x="-16" y="42" class="sublabel">p2</text>
    <text x="64" y="28" class="sublabel">p3</text>
  </g>

  <!-- Upper AND Output Term 1: A · B -->
  <line x1="340" y1="120" x2="490" y2="120" class="wire"/>
  <text x="365" y="112" class="term-tag">Term 1 = A · B</text>

  <!-- Stage 1: Lower AND Gate 2 (74LS08 Gate 2) -->
  <!-- Inputs C and D -->
  <line x1="150" y1="237" x2="280" y2="237" class="wire"/>
  <line x1="150" y1="287" x2="250" y2="287" class="wire"/>
  <line x1="250" y1="287" x2="250" y2="263" class="wire"/>
  <line x1="250" y1="263" x2="280" y2="263" class="wire"/>

  <g transform="translate(280, 225)">
    <!-- 74LS08 AND Gate 2 (Pins 4, 5 -> 6) -->
    <path d="M0,0 L35,0 A25,25 0 0,1 35,50 L0,50 Z" class="gate-body"/>
    <text x="10" y="30" font-family="Inter" font-weight="800" font-size="14" fill="#22d3ee">&amp;</text>
    <text x="5" y="-6" class="ic-badge">IC1: 74LS08 (2/4)</text>
    <text x="-16" y="16" class="sublabel">p4</text>
    <text x="-16" y="42" class="sublabel">p5</text>
    <text x="64" y="28" class="sublabel">p6</text>
  </g>

  <!-- Lower AND Output Term 2: C · D -->
  <line x1="340" y1="250" x2="490" y2="250" class="wire"/>
  <text x="365" y="242" class="term-tag">Term 2 = C · D</text>

  <!-- Routing Wires to OR Gate (74LS32) -->
  <line x1="490" y1="120" x2="520" y2="120" class="wire"/>
  <line x1="520" y1="120" x2="520" y2="173" class="wire"/>
  <line x1="520" y1="173" x2="550" y2="173" class="wire"/>

  <line x1="490" y1="250" x2="520" y2="250" class="wire"/>
  <line x1="520" y1="250" x2="520" y2="197" class="wire"/>
  <line x1="520" y1="197" x2="550" y2="197" class="wire"/>

  <!-- Stage 2: OR Gate (74LS32 Gate 1, Pins 1, 2 -> 3) -->
  <g transform="translate(550, 160)">
    <path d="M-8,0 Q12,25 -8,50 Q45,50 68,25 Q45,0 -8,0 Z" class="gate-or"/>
    <text x="18" y="31" font-family="Inter" font-weight="800" font-size="14" fill="#10b981">≥1</text>
    <text x="-5" y="-8" class="ic-badge">IC2: 74LS32 (1/4)</text>
    <text x="-24" y="17" class="sublabel">p1</text>
    <text x="-24" y="41" class="sublabel">p2</text>
    <text x="74" y="28" class="sublabel">p3</text>
  </g>

  <!-- Final Output Line -->
  <line x1="618" y1="185" x2="710" y2="185" class="wire-hi"/>

  <!-- Output Indicator Stage (Resistor + LED) -->
  <g transform="translate(710, 155)">
    <!-- R_limit 330 Ohm -->
    <rect x="0" y="24" width="30" height="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="2"/>
    <text x="2" y="18" class="sublabel" font-size="10">330Ω</text>
    <line x1="30" y1="30" x2="48" y2="30" class="wire-hi"/>
    <!-- LED Symbol -->
    <polygon points="48,20 48,40 64,30" fill="#10b981" stroke="#34d399" stroke-width="1.5"/>
    <line x1="64" y1="20" x2="64" y2="40" stroke="#34d399" stroke-width="2"/>
    <!-- Ground return -->
    <line x1="64" y1="30" x2="80" y2="30" class="wire"/>
    <line x1="80" y1="30" x2="80" y2="45" class="wire"/>
    <line x1="72" y1="45" x2="88" y2="45" stroke="#94a3b8" stroke-width="2"/>
    <line x1="75" y1="49" x2="85" y2="49" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="78" y1="53" x2="82" y2="53" stroke="#94a3b8" stroke-width="1"/>
    <text x="92" y="34" class="out-tag">PUMP (Y)</text>
  </g>

  <!-- Bottom Pinout & Ground Rule Box -->
  <g transform="translate(40, 330)">
    <rect width="780" height="34" fill="#0f172a" stroke="#334155" stroke-width="1" rx="6"/>
    <text x="16" y="22" font-family="JetBrains Mono" font-size="11" fill="#cbd5e1">
      ⚡ IC Power Rules: Connect <tspan fill="#f87171" font-weight="700">Pin 14 to +5V (Vcc)</tspan> and <tspan fill="#38bdf8" font-weight="700">Pin 7 to 0V (GND)</tspan> on both 74LS08 and 74LS32 ICs. Never float TTL inputs!
    </text>
  </g>
</svg>
