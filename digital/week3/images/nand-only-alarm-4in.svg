<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" width="100%" height="100%">
  <rect width="560" height="220" rx="10" fill="#0b1120" stroke="#334155" stroke-width="1.5"/>
  <rect x="0" y="0" width="560" height="32" rx="10" fill="rgba(168, 85, 247, 0.16)"/>
  <text x="16" y="21" fill="#c084fc" font-family="'Inter', sans-serif" font-weight="800" font-size="11.5">4-INPUT NAND-ONLY CIRCUIT: Alarm = (A·B) + (C·D)  [1x 74LS00]</text>

  <!-- Input A & B into NAND 1 -->
  <text x="20" y="63" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800">A</text>
  <line x1="38" y1="58" x2="110" y2="58" stroke="#38bdf8" stroke-width="2"/>
  <text x="20" y="87" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800">B</text>
  <line x1="38" y1="82" x2="110" y2="82" stroke="#38bdf8" stroke-width="2"/>

  <!-- NAND 1 -->
  <path d="M 110 48 L 135 48 A 22 22 0 0 1 135 92 L 110 92 Z" fill="#1e293b" stroke="#c084fc" stroke-width="2"/>
  <circle cx="162" cy="70" r="4" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
  <text x="131" y="74" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle">NAND1</text>
  <text x="210" y="63" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">!(A·B)</text>
  <line x1="166" y1="70" x2="260" y2="70" stroke="#c084fc" stroke-width="2"/>
  <line x1="260" y1="70" x2="260" y2="98" stroke="#c084fc" stroke-width="2"/>
  <line x1="260" y1="98" x2="295" y2="98" stroke="#c084fc" stroke-width="2"/>

  <!-- Input C & D into NAND 2 -->
  <text x="20" y="140" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800">C</text>
  <line x1="38" y1="135" x2="110" y2="135" stroke="#38bdf8" stroke-width="2"/>
  <text x="20" y="165" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800">D</text>
  <line x1="38" y1="160" x2="110" y2="160" stroke="#38bdf8" stroke-width="2"/>

  <!-- NAND 2 -->
  <path d="M 110 125 L 135 125 A 22 22 0 0 1 135 169 L 110 169 Z" fill="#1e293b" stroke="#c084fc" stroke-width="2"/>
  <circle cx="162" cy="147" r="4" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
  <text x="131" y="151" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle">NAND2</text>
  <text x="210" y="140" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">!(C·D)</text>
  <line x1="166" y1="147" x2="260" y2="147" stroke="#c084fc" stroke-width="2"/>
  <line x1="260" y1="147" x2="260" y2="118" stroke="#c084fc" stroke-width="2"/>
  <line x1="260" y1="118" x2="295" y2="118" stroke="#c084fc" stroke-width="2"/>

  <!-- NAND 3 (Final Output) -->
  <path d="M 295 86 L 320 86 A 22 22 0 0 1 320 130 L 295 130 Z" fill="#134e4a" stroke="#10b981" stroke-width="2.2"/>
  <circle cx="347" cy="108" r="4" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <text x="316" y="112" fill="#a7f3d0" font-family="'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle">NAND3</text>
  <line x1="351" y1="108" x2="415" y2="108" stroke="#10b981" stroke-width="3"/>
  <circle cx="419" cy="108" r="5" fill="#10b981"/>
  <text x="430" y="112" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="800">Alarm = A·B + C·D</text>

  <!-- Footer Note -->
  <text x="280" y="202" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">All 4 inputs (A, B, C, D) implemented on ONE 74LS00 IC — no AND or OR ICs required!</text>
</svg>
