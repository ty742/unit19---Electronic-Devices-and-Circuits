<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="100%" height="100%">
  <defs>
    <linearGradient id="schBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="280" rx="12" fill="#0b1120" stroke="#334155" stroke-width="1.5"/>

  <!-- Title banner -->
  <rect x="0" y="0" width="800" height="38" rx="12" fill="rgba(16, 185, 129, 0.15)"/>
  <text x="25" y="24" fill="#34d399" font-family="'Inter', sans-serif" font-weight="800" font-size="13">MINIMAL SCHEMATIC FROM K-MAP: REJECT = (!A · C) + (A · !C)</text>
  <text x="775" y="24" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">Gate-Minimised Implementation</text>

  <!-- Input A -->
  <text x="35" y="85" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800">A</text>
  <line x1="55" y1="80" x2="140" y2="80" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="140" cy="80" r="4" fill="#38bdf8"/>
  <line x1="140" y1="80" x2="140" y2="190" stroke="#38bdf8" stroke-width="2"/>
  <line x1="140" y1="190" x2="310" y2="190" stroke="#38bdf8" stroke-width="2"/>

  <!-- Inverter for A -->
  <line x1="140" y1="80" x2="180" y2="80" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="180,70 205,80 180,90" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="209" cy="80" r="3.5" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="213" y1="80" x2="310" y2="80" stroke="#f59e0b" stroke-width="2"/>
  <text x="245" y="72" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="10">!A</text>

  <!-- Input C -->
  <text x="35" y="145" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800">C</text>
  <line x1="55" y1="140" x2="110" y2="140" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="110" cy="140" r="4" fill="#38bdf8"/>
  <line x1="110" y1="140" x2="110" y2="105" stroke="#38bdf8" stroke-width="2"/>
  <line x1="110" y1="105" x2="310" y2="105" stroke="#38bdf8" stroke-width="2"/>

  <!-- Inverter for C -->
  <line x1="110" y1="140" x2="110" y2="215" stroke="#38bdf8" stroke-width="2"/>
  <line x1="110" y1="215" x2="180" y2="215" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="180,205 205,215 180,225" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="209" cy="215" r="3.5" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="213" y1="215" x2="310" y2="215" stroke="#f59e0b" stroke-width="2"/>
  <text x="245" y="208" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="10">!C</text>

  <!-- Gate 1: AND (!A · C) -->
  <path d="M 310 70 L 340 70 A 25 25 0 0 1 340 115 L 310 115 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <line x1="365" y1="92" x2="480" y2="92" stroke="#38bdf8" stroke-width="2"/>
  <text x="400" y="85" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">!A·C</text>

  <!-- Gate 2: AND (A · !C) -->
  <path d="M 310 180 L 340 180 A 25 25 0 0 1 340 225 L 310 225 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <line x1="365" y1="202" x2="480" y2="202" stroke="#38bdf8" stroke-width="2"/>
  <text x="400" y="195" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">A·!C</text>

  <!-- Gate 3: OR -->
  <path d="M 480 75 Q 500 145 480 220 Q 550 220 575 145 Q 550 75 480 75 Z" fill="#1e293b" stroke="#10b981" stroke-width="2.5"/>
  <line x1="575" y1="145" x2="670" y2="145" stroke="#10b981" stroke-width="3"/>
  <circle cx="675" cy="145" r="5" fill="#10b981"/>
  <text x="690" y="150" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="800">Reject</text>

  <!-- Annotation footer -->
  <rect x="25" y="245" width="750" height="24" rx="4" fill="rgba(15, 23, 42, 0.7)"/>
  <text x="400" y="261" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10.5" text-anchor="middle">Equivalent to XOR logic ($A \oplus C$). Reduced from 16 minterms to only 2 product terms!</text>
</svg>
