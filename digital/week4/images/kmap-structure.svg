<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="100%">
  <defs>
    <linearGradient id="kmapCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="380" rx="14" fill="#0b1120" stroke="#334155" stroke-width="1.5"/>

  <!-- Left: 4-Variable K-Map Matrix with Gray Code -->
  <g transform="translate(30, 25)">
    <rect width="450" height="330" rx="10" fill="url(#kmapCard)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="28" fill="#38bdf8" font-family="'Inter', sans-serif" font-weight="800" font-size="14">4-VARIABLE K-MAP ANATOMY (16 CELLS)</text>
    <text x="430" y="28" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">Gray Code: 00 → 01 → 11 → 10</text>

    <!-- Top Variable Header CD -->
    <text x="75" y="65" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">AB \ CD</text>
    <text x="165" y="65" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" text-anchor="middle">00</text>
    <text x="235" y="65" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" text-anchor="middle">01</text>
    <text x="305" y="65" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" text-anchor="middle">11</text>
    <text x="375" y="65" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" text-anchor="middle">10</text>

    <!-- Row 00 (m0, m1, m3, m2) -->
    <text x="75" y="115" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">00</text>
    <rect x="130" y="80" width="70" height="55" fill="#0f172a" stroke="#334155"/>
    <text x="165" y="112" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="14" text-anchor="middle">0</text>
    <text x="135" y="93" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">m0</text>

    <rect x="200" y="80" width="70" height="55" fill="#0f172a" stroke="#334155"/>
    <text x="235" y="112" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="14" text-anchor="middle">0</text>
    <text x="205" y="93" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">m1</text>

    <rect x="270" y="80" width="70" height="55" fill="#0f172a" stroke="#334155"/>
    <text x="305" y="112" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="14" text-anchor="middle">1</text>
    <text x="275" y="93" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">m3</text>

    <rect x="340" y="80" width="70" height="55" fill="#0f172a" stroke="#334155"/>
    <text x="375" y="112" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="14" text-anchor="middle">1</text>
    <text x="345" y="93" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">m2</text>

    <!-- Row 01 (m4, m5, m7, m6) -->
    <text x="75" y="170" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">01</text>
    <rect x="130" y="135" width="70" height="55" fill="#0f172a" stroke="#334155"/>
    <text x="165" y="167" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="14" text-anchor="middle">0</text>
    <text x="135" y="148" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">m4</text>

    <rect x="200" y="135" width="70" height="55" fill="#0f172a" stroke="#334155"/>
    <text x="235" y="167" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="14" text-anchor="middle">0</text>
    <text x="205" y="148" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">m5</text>

    <rect x="270" y="135" width="70" height="55" fill="#0f172a" stroke="#334155"/>
    <text x="305" y="167" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="14" text-anchor="middle">1</text>
    <text x="275" y="148" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">m7</text>

    <rect x="340" y="135" width="70" height="55" fill="#0f172a" stroke="#334155"/>
    <text x="375" y="167" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="14" text-anchor="middle">1</text>
    <text x="345" y="148" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">m6</text>

    <!-- Row 11 (m12, m13, m15, m14) -->
    <text x="75" y="225" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">11</text>
    <rect x="130" y="190" width="70" height="55" fill="#0f172a" stroke="#334155"/>
    <text x="165" y="222" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="14" text-anchor="middle">1</text>
    <text x="135" y="203" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">m12</text>

    <rect x="200" y="190" width="70" height="55" fill="#0f172a" stroke="#334155"/>
    <text x="235" y="222" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="14" text-anchor="middle">1</text>
    <text x="205" y="203" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">m13</text>

    <rect x="270" y="190" width="70" height="55" fill="#0f172a" stroke="#334155"/>
    <text x="305" y="222" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="14" text-anchor="middle">1</text>
    <text x="275" y="203" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">m15</text>

    <rect x="340" y="190" width="70" height="55" fill="#0f172a" stroke="#334155"/>
    <text x="375" y="222" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="14" text-anchor="middle">1</text>
    <text x="345" y="203" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">m14</text>

    <!-- Row 10 (m8, m9, m11, m10) -->
    <text x="75" y="280" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">10</text>
    <rect x="130" y="245" width="70" height="55" fill="#0f172a" stroke="#334155"/>
    <text x="165" y="277" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="14" text-anchor="middle">1</text>
    <text x="135" y="258" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">m8</text>

    <rect x="200" y="245" width="70" height="55" fill="#0f172a" stroke="#334155"/>
    <text x="235" y="277" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="14" text-anchor="middle">1</text>
    <text x="205" y="258" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">m9</text>

    <rect x="270" y="245" width="70" height="55" fill="#0f172a" stroke="#334155"/>
    <text x="305" y="277" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="14" text-anchor="middle">0</text>
    <text x="275" y="258" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">m11</text>

    <rect x="340" y="245" width="70" height="55" fill="#0f172a" stroke="#334155"/>
    <text x="375" y="277" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="14" text-anchor="middle">0</text>
    <text x="345" y="258" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">m10</text>

    <!-- Visual Group Overlays -->
    <!-- Group 1: 4-cell group (m2, m3, m6, m7) -> C -->
    <rect x="274" y="84" width="132" height="102" rx="8" fill="rgba(16, 185, 129, 0.25)" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4,3"/>
    <text x="340" y="130" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">Term 1: !A·C</text>

    <!-- Group 2: 4-cell group (m12, m13, m8, m9) -> A·!C -->
    <rect x="134" y="194" width="132" height="102" rx="8" fill="rgba(245, 158, 11, 0.25)" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4,3"/>
    <text x="200" y="250" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800">Term 2: A·!C</text>
  </g>

  <!-- Right: Grouping Rules & Eliminating Variables -->
  <g transform="translate(505, 25)">
    <rect width="365" height="330" rx="10" fill="url(#kmapCard)" stroke="#10b981" stroke-width="1.5"/>
    <text x="20" y="28" fill="#34d399" font-family="'Inter', sans-serif" font-weight="800" font-size="14">THE 5 GOLDEN GROUPING RULES</text>

    <!-- Rule 1 -->
    <g transform="translate(18, 48)">
      <rect width="329" height="46" rx="6" fill="#0f172a" stroke="#334155"/>
      <circle cx="20" cy="23" r="10" fill="rgba(56, 189, 248, 0.2)"/>
      <text x="20" y="27" fill="#38bdf8" font-family="'Inter', sans-serif" font-weight="800" font-size="11" text-anchor="middle">1</text>
      <text x="38" y="20" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Group Size Must Be Powers of 2</text>
      <text x="38" y="36" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Only 1, 2, 4, 8, or 16 adjacent 1s. Never 3, 5, or 6!</text>
    </g>

    <!-- Rule 2 -->
    <g transform="translate(18, 102)">
      <rect width="329" height="46" rx="6" fill="#0f172a" stroke="#334155"/>
      <circle cx="20" cy="23" r="10" fill="rgba(16, 185, 129, 0.2)"/>
      <text x="20" y="27" fill="#10b981" font-family="'Inter', sans-serif" font-weight="800" font-size="11" text-anchor="middle">2</text>
      <text x="38" y="20" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Rectangles &amp; Squares Only</text>
      <text x="38" y="36" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">No diagonals or L-shapes. Must be continuous boxes.</text>
    </g>

    <!-- Rule 3 -->
    <g transform="translate(18, 156)">
      <rect width="329" height="46" rx="6" fill="#0f172a" stroke="#334155"/>
      <circle cx="20" cy="23" r="10" fill="rgba(245, 158, 11, 0.2)"/>
      <text x="20" y="27" fill="#f59e0b" font-family="'Inter', sans-serif" font-weight="800" font-size="11" text-anchor="middle">3</text>
      <text x="38" y="20" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Make Groups as Large as Possible</text>
      <text x="38" y="36" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Larger groups eliminate more variables from the term!</text>
    </g>

    <!-- Rule 4 -->
    <g transform="translate(18, 210)">
      <rect width="329" height="46" rx="6" fill="#0f172a" stroke="#334155"/>
      <circle cx="20" cy="23" r="10" fill="rgba(168, 85, 247, 0.2)"/>
      <text x="20" y="27" fill="#a855f7" font-family="'Inter', sans-serif" font-weight="800" font-size="11" text-anchor="middle">4</text>
      <text x="38" y="20" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Torus Wrap-Around Edges</text>
      <text x="38" y="36" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Left edge connects to right; top edge connects to bottom.</text>
    </g>

    <!-- Rule 5 -->
    <g transform="translate(18, 264)">
      <rect width="329" height="46" rx="6" fill="#0f172a" stroke="#334155"/>
      <circle cx="20" cy="23" r="10" fill="rgba(239, 68, 68, 0.2)"/>
      <text x="20" y="27" fill="#ef4444" font-family="'Inter', sans-serif" font-weight="800" font-size="11" text-anchor="middle">5</text>
      <text x="38" y="20" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Overlapping Groups Are Legal</text>
      <text x="38" y="36" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Share existing 1s to make larger groups and reduce IC count.</text>
    </g>
  </g>
</svg>
